<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALLEN ALBERT T. VARIAS - Minimalist Printable Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
      -webkit-font-smoothing: antialiased;
    }

    /* Print-Specific Styles to ensure 100% accurate physical sizing */
    @media print {
      @page {
        margin: 0;
        size: A4;
      }
      body {
        background-color: #ffffff !important;
        margin: 0;
        padding: 2in 0 0 2in; /* Offset for printer margins */
        display: block;
      }
      .no-print {
        display: none !important;
      }
      .print-container {
        box-shadow: none !important;
        background: transparent !important;
      }
      .card {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }

    /* Precision Millimeter Sizing for the Card (CR80 Standard Proportions) */
    .card-wrapper {
      position: relative;
      width: 84mm;
      height: 53mm;
    }

    .card {
      width: 84mm;
      height: 53mm;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      border-radius: 3mm; /* Slight rounding for a premium card feel */
      box-sizing: border-box;
      padding: 6mm;
    }

    /* Cutting Guide Marks (Crop Marks) */
    .crop-mark {
      position: absolute;
      width: 5mm;
      height: 5mm;
      border-color: #94a3b8; /* Subtle gray for cutting */
      border-style: solid;
      border-width: 0;
    }
    .crop-top-left { top: -2mm; left: -2mm; border-top-width: 0.5pt; border-left-width: 0.5pt; }
    .crop-top-right { top: -2mm; right: -2mm; border-top-width: 0.5pt; border-right-width: 0.5pt; }
    .crop-bottom-left { bottom: -2mm; left: -2mm; border-bottom-width: 0.5pt; border-left-width: 0.5pt; }
    .crop-bottom-right { bottom: -2mm; right: -2mm; border-bottom-width: 0.5pt; border-right-width: 0.5pt; }

    /* SVG QR Code overrides to ensure sharpness */
    #qr-container svg {
      display: block;
      width: 26mm;
      height: 26mm;
      shape-rendering: crispEdges;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Interactive Controls (Hidden during printing) -->
  <div class="no-print text-center mb-10 max-w-md">
    <h1 class="text-2xl font-bold text-slate-800 mb-2">High-Res Printable Card</h1>
    <p class="text-slate-500 text-sm mb-6">Exactly 8.4 cm × 5.3 cm. Pure black layout with name and QR code. Crop marks are included to guide your scissors/blade.</p>
    <button 
      onclick="window.print()" 
      class="bg-black hover:bg-slate-800 text-white font-semibold px-6 py-3 rounded-lg shadow-lg transition-all flex items-center justify-center gap-2 mx-auto"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
      Print Card
    </button>
  </div>

  <!-- The Printable Area -->
  <div class="print-container bg-white p-12 shadow-2xl rounded-xl border border-slate-200">
    <div class="card-wrapper">
      
      <!-- Crop Marks for cutting -->
      <div class="crop-mark crop-top-left"></div>
      <div class="crop-mark crop-top-right"></div>
      <div class="crop-mark crop-bottom-left"></div>
      <div class="crop-mark crop-bottom-right"></div>

      <!-- The Physical Card Content -->
      <div class="card">
        
        <!-- Element 1: Full Name -->
        <h2 class="text-[10pt] font-bold tracking-[0.15em] text-white uppercase text-center leading-tight mb-[6mm]">
          ALLEN ALBERT T. VARIAS
        </h2>

        <!-- Element 2: QR Code Container -->
        <div class="bg-white p-[1.5mm] rounded-sm shadow-sm flex items-center justify-center">
          <div id="qr-container"></div>
        </div>

      </div>

    </div>
  </div>

  <script>
    // Generate the high-resolution vector QR Code
    document.addEventListener("DOMContentLoaded", () => {
      // Create QR Code linked to the digital business card
      const targetUrl = "https://alvarias.github.io/links/";
      const qr = qrcode(0, 'H'); // 'H' for High error correction
      qr.addData(targetUrl);
      qr.make();

      // Output as clean SVG format for infinite scaling/crisp printing
      const svgTag = qr.createSvgTag({
        cellSize: 4, 
        margin: 0
      });

      document.getElementById('qr-container').innerHTML = svgTag;
    });
  </script>
</body>
</html>

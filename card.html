<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Allen Albert T. Varias - High-Contrast Printable Business Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,500;0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@600;700&display=swap');

    body {
      font-family: 'Inter', Arial, sans-serif;
    }

    /* 3D Flip Card Styles */
    .perspective-1000 {
      perspective: 1200px;
    }
    .flip-card-inner {
      transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flipped {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }

    /* Cutting Guide Crop Marks for Single Print Cards */
    .single-cut-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    /* A4 Sheet Container & Cutting Guides */
    .a4-page {
      width: 210mm;
      min-height: 297mm;
      background: #ffffff;
      margin: 0 auto;
      padding: 14mm 16.1mm;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .a4-grid {
      display: grid;
      grid-template-columns: repeat(2, 88.9mm);
      grid-template-rows: repeat(5, 50.8mm);
      gap: 0;
      border: 0.6pt dashed #64748b;
      position: relative;
    }

    .a4-cell {
      width: 88.9mm;
      height: 50.8mm;
      box-sizing: border-box;
      position: relative;
      border-right: 0.6pt dashed #64748b;
      border-bottom: 0.6pt dashed #64748b;
      overflow: hidden;
    }
    .a4-cell:nth-child(2n) {
      border-right: none;
    }
    .a4-cell:nth-last-child(-n+2) {
      border-bottom: none;
    }

    /* Outer Corner Crop Marks on A4 Grid */
    .crop-mark {
      position: absolute;
      width: 6mm;
      height: 6mm;
      pointer-events: none;
    }
    .crop-tl { top: -8mm; left: -8mm; border-right: 1pt solid #0f172a; border-bottom: 1pt solid #0f172a; }
    .crop-tr { top: -8mm; right: -8mm; border-left: 1pt solid #0f172a; border-bottom: 1pt solid #0f172a; }
    .crop-bl { bottom: -8mm; left: -8mm; border-right: 1pt solid #0f172a; border-top: 1pt solid #0f172a; }
    .crop-br { bottom: -8mm; right: -8mm; border-left: 1pt solid #0f172a; border-top: 1pt solid #0f172a; }

    /* Print Styles */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }

      /* Mode 1: Single Print (Front + Back with Cutting Guides) */
      body[data-print-mode="single"] #a4-sheet-view,
      body[data-print-mode="single"] #flip-view {
        display: none !important;
      }
      body[data-print-mode="single"] #side-by-side-view {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 14mm !important;
        min-height: 297mm !important;
        padding: 15mm !important;
      }
      body[data-print-mode="single"] .print-card {
        width: 88.9mm !important;
        height: 50.8mm !important;
        box-shadow: none !important;
        border: 0.75pt dashed #475569 !important;
        border-radius: 0 !important;
        page-break-inside: avoid !important;
        position: relative !important;
      }
      body[data-print-mode="single"] .single-cut-label {
        display: block !important;
        font-size: 8pt !important;
        font-family: 'JetBrains Mono', monospace !important;
        color: #475569 !important;
        margin-bottom: 2mm !important;
        text-align: center !important;
      }

      /* Mode 2: A4 10-Card Multi-Copy Sheet with Cutting Guides */
      body[data-print-mode="a4"] #side-by-side-view,
      body[data-print-mode="a4"] #flip-view {
        display: none !important;
      }
      body[data-print-mode="a4"] #a4-sheet-view {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      body[data-print-mode="a4"] .a4-page {
        box-shadow: none !important;
        border: none !important;
        margin: 0 auto !important;
        width: 210mm !important;
        height: 297mm !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }
    }
  </style>
</head>

        >

        </button>
